name: Android base
on:
  push:
    paths: ['android/**', '.github/workflows/android-base.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-base.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x gradlew && ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
        working-directory: android
